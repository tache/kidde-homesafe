name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  test:
    name: "Lint and Test"
    runs-on: "ubuntu-latest"
    # The package declares requires-python >=3.11, so every version it claims
    # to support gets tested rather than only the newest one.
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install dependencies"
        run: "pip install -r requirements-test.txt"

      - name: "Run ruff"
        run: "ruff check ."

      - name: "Run pytest"
        run: "pytest"
