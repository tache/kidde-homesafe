---
name: "Bug report"
description: "Report a bug with the library"
labels: "Bug"
body:
  - type: markdown
    attributes:
      value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have filled out the issue template to the best of my ability.
          required: true
        - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
          required: true
        - label: This issue is not a duplicate issue of any [previous issues](https://github.com/tache/kidde-homesafe/issues?q=is%3Aissue+label%3A%22Bug%22+).
          required: true
        - label: This is a bug in the library itself, not in the Home Assistant integration (report those at [tache/homeassistant-kidde](https://github.com/tache/homeassistant-kidde/issues)).
          required: true
  - type: input
    attributes:
      label: "Library version"
      description: "Output of `pip show kidde-homesafe`, or the commit you are running from."
    validations:
      required: true
  - type: input
    attributes:
      label: "Python version"
      description: "Output of `python --version`."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Describe the issue"
      description: "A clear and concise description of what the issue is."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Code sample"
      description: "The smallest snippet that reproduces the problem. Remove your email, password, and cookies before posting."
      render: python
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Traceback or logs"
      description: "The full traceback, if there is one. Remove your email, password, and cookies before posting."
      render: text
    validations:
      required: false
